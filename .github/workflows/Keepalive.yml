name: Keep Render Alive

on:
  schedule:
    # Har 10 minute mein chalega (UTC time zone ke hisab se)
    - cron: '*/10 * * * *'
  # Taaki aap manually bhi Actions tab se test kar sakein
  workflow_dispatch: 

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render App
        run: |
          curl -I -s -o /dev/null -w "%{http_code}" https://onrender.com
